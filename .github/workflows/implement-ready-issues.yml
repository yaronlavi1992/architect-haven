name: Implement Ready Issues

# Runs an Aider coding agent on Groq when an issue receives a ready-to-implement label.
# The agent follows .agents/skills/implementation/SKILL.md to implement the issue,
# open a pull request, and report progress back to the original issue.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement
        required: true
        type: string

concurrency:
  group: implement-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement issue
    runs-on: ubuntu-latest
    env:
      # Svelte's static env module requires this variable to exist at build time.
      # No backend request is made by check/build, so a non-secret placeholder is sufficient.
      PUBLIC_CONVEX_URL: https://factory-validation.convex.cloud
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'Ready to implement' ||
      github.event.label.name == 'ready-to-implement' ||
      github.event.label.name == 'ready to implement'
    permissions:
      actions: write # explicitly dispatch review after an agent-created PR
      contents: write # let the agent commit and push an implementation branch
      issues: write # let the agent post progress and final PR link comments
      pull-requests: write # let the agent open the implementation PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Aider
        run: python -m pip install --disable-pip-version-check aider-chat

      - name: Implement issue with Aider on Groq
        id: implement
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::GROQ_API_KEY is not configured."
            exit 1
          fi

          issue_json="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" \
            --json title,body,comments,labels,url)"
          title="$(jq -r '.title' <<<"$issue_json")"
          slug="$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' |
            sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g' | cut -c1-40)"
          branch="factory/issue-${ISSUE_NUMBER}-${slug:-implementation}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          jq -r '
            "Title: " + .title + "\n\nBody:\n" + (.body // "") +
            "\n\nComments:\n" +
            ((.comments // []) | map("- " + (.author.login // "unknown") + ": " + .body) | join("\n"))
          ' <<<"$issue_json" > "$RUNNER_TEMP/issue.txt"

          aider \
            --model groq/llama-3.3-70b-versatile \
            --yes-always \
            --no-auto-commits \
            --no-dirty-commits \
            --no-gitignore \
            --map-tokens 2048 \
            --message "$(cat "$RUNNER_TEMP/issue.txt")

          Implement GitHub issue #$ISSUE_NUMBER in this repository. Read any
          relevant PRODUCT.md and TECH.md specs first. Make the smallest cohesive
          change that fully satisfies the issue and update appropriate tests or
          documentation. Follow existing project conventions. Do not edit
          unrelated files, commit, push, open a PR, or reveal secrets; the
          workflow handles delivery."

          if git diff --quiet; then
            echo "::error::Aider completed without changing any files."
            exit 1
          fi

          validation=()
          npm ci
          if npm run check; then validation+=("npm run check: passed"); else validation+=("npm run check: failed"); fi
          if npm run build; then validation+=("npm run build: passed"); else validation+=("npm run build: failed"); fi

          git add --all
          git commit -m "fix: implement issue #$ISSUE_NUMBER"
          git push --set-upstream origin "$branch"

          {
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf '## Summary\n\nImplemented by the Groq-backed software factory.\n\n'
            printf '## Validation\n\n'
            printf -- '- %s\n' "${validation[@]}"
          } > "$RUNNER_TEMP/pr-body.md"

          pr_url="$(gh pr create --repo "$REPO" --base "${{ github.event.repository.default_branch || github.ref_name }}" \
            --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md")"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "Implementation complete and ready for review: $pr_url"

      - name: Dispatch review for the implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list --repo "$REPO" --state open \
              --json number,body,createdAt \
              --jq 'map(select((.body // "") | test("(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#'"$ISSUE_NUMBER"'\\b"))) | sort_by(.createdAt) | last | .number // empty'
          )"
          if [ -z "$pr_number" ]; then
            echo "::error::The implementation agent completed but no open PR closing issue #$ISSUE_NUMBER was found."
            exit 1
          fi
          gh workflow run review-pr.yml --repo "$REPO" \
            --ref "${{ github.event.repository.default_branch || github.ref_name }}" \
            -f pr_number="$pr_number"

name: Implement Ready Issues

# Runs an OpenCode agent on Groq when an issue receives a ready-to-implement label.
# The agent follows .agents/skills/implementation/SKILL.md to implement the issue,
# open a pull request, and report progress back to the original issue.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement
        required: true
        type: string

concurrency:
  group: implement-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement issue
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'Ready to implement' ||
      github.event.label.name == 'ready-to-implement' ||
      github.event.label.name == 'ready to implement'
    permissions:
      actions: write # explicitly dispatch review after an agent-created PR
      contents: write # let the agent commit and push an implementation branch
      issues: write # let the agent post progress and final PR link comments
      pull-requests: write # let the agent open the implementation PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: npm install --global opencode-ai@latest

      - name: Implement issue with OpenCode on Groq
        id: implement
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::GROQ_API_KEY is not configured."
            exit 1
          fi

          opencode run --model groq/llama-3.3-70b-versatile "
          First read .agents/skills/implementation/SKILL.md and follow its
          repository implementation workflow for GitHub issue #$ISSUE_NUMBER
          in $REPO.

          You are running non-interactively in GitHub Actions with GH_TOKEN
          already authenticated. Fetch the complete issue and comments with gh.
          Read any relevant PRODUCT.md and TECH.md specs before changing code.
          Implement the smallest cohesive change, add or update tests where
          appropriate, and run npm check, targeted tests, and npm run build.
          Configure git user.name as github-actions[bot] and user.email as
          github-actions[bot]@users.noreply.github.com. Create a descriptive
          branch, commit only the intended files, push it, and open a pull
          request against the default branch. The PR body must include
          'Closes #$ISSUE_NUMBER' plus validation results. Finally, comment on
          issue #$ISSUE_NUMBER with the real PR URL. Do not claim success unless
          the PR exists. Do not expose secrets.
          "

      - name: Dispatch review for the implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list --repo "$REPO" --state open \
              --json number,body,createdAt \
              --jq 'map(select((.body // "") | test("(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#'"$ISSUE_NUMBER"'\\b"))) | sort_by(.createdAt) | last | .number // empty'
          )"
          if [ -z "$pr_number" ]; then
            echo "::error::The implementation agent completed but no open PR closing issue #$ISSUE_NUMBER was found."
            exit 1
          fi
          gh workflow run review-pr.yml --repo "$REPO" \
            --ref "${{ github.event.repository.default_branch || github.ref_name }}" \
            -f pr_number="$pr_number"

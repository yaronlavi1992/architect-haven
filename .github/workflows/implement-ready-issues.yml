name: Implement Ready Issues

# Runs an Oz cloud agent when an issue receives a ready-to-implement label.
# The agent follows .agents/skills/implementation/SKILL.md to implement the issue,
# open a pull request, and report progress back to the original issue.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement
        required: true
        type: string

concurrency:
  group: implement-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement issue
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'Ready to implement' ||
      github.event.label.name == 'ready-to-implement' ||
      github.event.label.name == 'ready to implement'
    permissions:
      actions: write # explicitly dispatch review after an agent-created PR
      contents: write # let the agent commit and push an implementation branch
      issues: write # let the agent post progress and final PR link comments
      pull-requests: write # let the agent open the implementation PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Implement issue with Oz agent
        uses: warpdotdev/oz-agent-action@v1.0.25
        id: implement
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          name: "Implement issue #${{ inputs.issue_number || github.event.issue.number }}"
          prompt: |
            First read `.agents/skills/implementation/SKILL.md`, then follow it
            exactly to implement issue #${{ inputs.issue_number || github.event.issue.number }}
            in ${{ github.repository }}.

            Fetch the full issue and comments using `gh`. Read any linked or
            checked-in PRODUCT.md and TECH.md specs before inspecting code.
            Implement the smallest cohesive change, run the repository's tests,
            type checks, and build, and validate the result against specs when
            present. For visible or interactive changes, follow
            `.agents/skills/verify-behavior/SKILL.md` and collect computer-use
            evidence. Create and push a branch, open a pull request containing
            `Closes #${{ inputs.issue_number || github.event.issue.number }}`,
            and post the PR URL and validation results on the issue.
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          profile: ${{ vars.WARP_AGENT_PROFILE || '' }}
          cloud: true
          computer_use: true

      - name: Dispatch review for the implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list --repo "$REPO" --state open \
              --json number,body,createdAt \
              --jq 'map(select((.body // "") | test("(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#'"$ISSUE_NUMBER"'\\b"))) | sort_by(.createdAt) | last | .number // empty'
          )"
          if [ -z "$pr_number" ]; then
            echo "::warning::Oz completed but no open PR closing issue #$ISSUE_NUMBER was found."
            exit 0
          fi
          gh workflow run review-pr.yml --repo "$REPO" \
            --ref "${{ github.event.repository.default_branch || github.ref_name }}" \
            -f pr_number="$pr_number"

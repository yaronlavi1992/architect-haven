name: Implement Ready Issues

# Runs an Antigravity (agy) agent when an issue receives a ready-to-implement label.
# The agent follows .agents/skills/implementation/SKILL.md to implement the issue,
# open a pull request, and report progress back to the original issue.

on:
  issues:
    types: [labeled]

concurrency:
  group: implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement issue
    runs-on: ubuntu-latest
    if: >-
      github.event.label.name == 'Ready to implement' ||
      github.event.label.name == 'ready-to-implement' ||
      github.event.label.name == 'ready to implement'
    permissions:
      contents: write        # let the agent commit and push an implementation branch
      issues: write          # let the agent post progress and final PR link comments
      pull-requests: write   # let the agent open the implementation PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Antigravity CLI (agy)
        run: |
          npm install -g @google/antigravity-cli || curl -fsSL https://antigravity.google/install.sh | sh || true

      - name: Implement issue with Antigravity agent
        id: implement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          agy --dangerously-skip-permissions -p \
            "Use the Implementation skill in this repository at .agents/skills/implementation/SKILL.md to implement the GitHub issue that was just labeled ready to implement.

            - Repository: ${{ github.repository }}
            - Issue number: #${{ github.event.issue.number }}
            - Issue URL: ${{ github.event.issue.html_url }}
            - Applied label: ${{ github.event.label.name }}

            Fetch the full issue and comments with the authenticated `gh` CLI, find and read any linked or checked-in `PRODUCT.md` and `TECH.md` specs before inspecting implementation areas, inspect this checked-out codebase, implement the fix or feature, run tests, create a branch, push it, and open a GitHub pull request linking to issue #${{ github.event.issue.number }}."


name: Spec Ready Issues

# Runs an Antigravity (agy) agent when an issue receives a ready-to-spec label.
# The agent follows .agents/skills/spec/SKILL.md to delegate to the
# write-product-spec and write-tech-spec skills, create PRODUCT.md and
# TECH.md, open a specs PR, and report progress back to the issue.

on:
  issues:
    types: [labeled]

concurrency:
  group: spec-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  spec:
    name: Spec issue
    runs-on: ubuntu-latest
    if: >-
      github.event.label.name == 'Ready to spec' ||
      github.event.label.name == 'ready-to-spec' ||
      github.event.label.name == 'ready to spec'
    permissions:
      contents: write        # let the agent commit and push a specs branch
      issues: write          # let the agent post progress and update labels
      pull-requests: write   # let the agent open the specs PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Antigravity CLI (agy)
        run: |
          npm install -g @google/antigravity-cli || curl -fsSL https://antigravity.google/install.sh | sh || true

      - name: Spec issue with Antigravity agent
        id: spec
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          agy --dangerously-skip-permissions -p \
            "Create checked-in product and technical specs for the GitHub issue that was just labeled ready to spec following .agents/skills/spec/SKILL.md.

            - Repository: ${{ github.repository }}
            - Issue number: #${{ github.event.issue.number }}
            - Issue URL: ${{ github.event.issue.html_url }}
            - Applied label: ${{ github.event.label.name }}

            Follow the spec skill: fetch the full issue and comments with the authenticated `gh` CLI, read `roadmap.md` and `vision.md` if present, inspect this checked-out codebase, and create:
            - `specs/<issue-slug>/PRODUCT.md`
            - `specs/<issue-slug>/TECH.md`

            Create a specs branch, commit the spec files, push the branch, and open a GitHub pull request for review. Post status comments as directed by the skill."


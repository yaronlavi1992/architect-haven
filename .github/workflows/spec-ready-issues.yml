name: Spec Ready Issues

# Runs an Antigravity (agy) agent when an issue receives a ready-to-spec label.
# The agent follows .agents/skills/spec/SKILL.md to delegate to the
# write-product-spec and write-tech-spec skills, create PRODUCT.md and
# TECH.md, open a specs PR, and report progress back to the issue.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to specify
        required: true
        type: string

concurrency:
  group: spec-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  spec:
    name: Spec issue
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'Ready to spec' ||
      github.event.label.name == 'ready-to-spec' ||
      github.event.label.name == 'ready to spec'
    permissions:
      contents: write # let the agent commit and push a specs branch
      issues: write # let the agent post progress and update labels
      pull-requests: write # let the agent open the specs PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Spec issue with AI Agent
        id: spec
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          python3 - << 'EOF'
          import json, os, re, subprocess, urllib.request, urllib.error

          issue_num = os.environ['ISSUE_NUMBER']
          gh_token = os.environ.get('GH_TOKEN', '').strip()
          groq_key = os.environ.get('GROQ_API_KEY', '').strip()
          gemini_key = os.environ.get('GEMINI_API_KEY', '').strip()

          # 1. Fetch issue details
          issue_raw = subprocess.check_output(['gh', 'issue', 'view', issue_num, '--json', 'title,body,comments']).decode('utf-8')
          issue_data = json.loads(issue_raw)
          title = issue_data.get('title', 'issue')
          slug = re.sub(r'[^a-z0-9]+', '-', title.lower()).strip('-')[:30]

          prompt = f"""
          You are a Product & Technical Specification Agent.
          Create detailed product (PRODUCT.md) and technical (TECH.md) specs for the following issue:

          Issue Title: {title}
          Issue Body: {issue_data.get('body', '')}

          Return ONLY a raw JSON object with keys:
          {{
            "product_spec": "# Product Spec for {title}\\n\\n## Overview\\n...\\n\\n## User Stories\\n...",
            "tech_spec": "# Technical Spec for {title}\\n\\n## Architecture\\n...\\n\\n## Implementation Steps\\n..."
          }}
          """

          res_json = None

          # Try GitHub Models
          if gh_token and not res_json:
              try:
                  url = "https://models.inference.ai.azure.com/chat/completions"
                  headers = {"Content-Type": "application/json", "Authorization": f"Bearer {gh_token}", "User-Agent": "GitHub-Action"}
                  payload = {
                      "model": "gpt-4o-mini",
                      "response_format": {"type": "json_object"},
                      "messages": [{"role": "system", "content": "You output JSON only."}, {"role": "user", "content": prompt}],
                      "temperature": 0.1
                  }
                  req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method='POST')
                  with urllib.request.urlopen(req) as resp:
                      res_json = json.loads(json.loads(resp.read().decode('utf-8'))['choices'][0]['message']['content'])
              except Exception as e:
                  print(f"GitHub Models spec call failed: {e}")

          # Try Groq
          if groq_key and not res_json:
              try:
                  url = "https://api.groq.com/openai/v1/chat/completions"
                  headers = {"Content-Type": "application/json", "Authorization": f"Bearer {groq_key}", "User-Agent": "GitHub-Action"}
                  payload = {
                      "model": "llama-3.3-70b-versatile",
                      "response_format": {"type": "json_object"},
                      "messages": [{"role": "system", "content": "You output JSON only."}, {"role": "user", "content": prompt}],
                      "temperature": 0.1
                  }
                  req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method='POST')
                  with urllib.request.urlopen(req) as resp:
                      res_json = json.loads(json.loads(resp.read().decode('utf-8'))['choices'][0]['message']['content'])
              except Exception as e:
                  print(f"Groq spec call failed: {e}")

          if not res_json:
              raise RuntimeError("Could not generate specs with available AI providers.")

          spec_dir = f"specs/{slug}"
          os.makedirs(spec_dir, exist_ok=True)

          with open(f"{spec_dir}/PRODUCT.md", "w") as f:
              f.write(res_json.get("product_spec", "# Product Spec"))

          with open(f"{spec_dir}/TECH.md", "w") as f:
              f.write(res_json.get("tech_spec", "# Tech Spec"))

          branch_name = f"spec/issue-{issue_num}-{slug}"
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "checkout", "-b", branch_name], check=True)
          subprocess.run(["git", "add", spec_dir], check=True)
          subprocess.run(["git", "commit", "-m", f"docs: add PRODUCT.md and TECH.md specs for issue #{issue_num}"], check=True)
          subprocess.run(["git", "push", "origin", branch_name], check=True)

          pr_out = subprocess.check_output([
              "gh", "pr", "create",
              "--title", f"Specs: {title}",
              "--body", f"Automated specs for issue #{issue_num}.\\n\\nContains `PRODUCT.md` and `TECH.md` under `{spec_dir}/`.",
              "--head", branch_name,
              "--base", "master"
          ]).decode('utf-8').strip()

          subprocess.run([
              "gh", "issue", "comment", issue_num,
              "--body", f"Created specifications PR for review: {pr_out}"
          ])
          EOF

name: Triage New Issues

# Triages a newly opened issue with an Antigravity (agy) agent.
#
# The agent runs read-only (issues: read) and emits a structured JSON result;
# the separate `apply` job (issues: write) applies the label and comment to the
# triggering issue only.
#
# Setup: the GEMINI_API_KEY repository secret must be set.

on:
  issues:
    types: [opened]

# Avoid duplicate triage runs if the same issue fires overlapping events.
concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage issue
    runs-on: ubuntu-latest
    permissions:
      contents: read # let the agent inspect the checked-out codebase
      issues: read # let the agent read the issue/comments/labels — never write
    outputs:
      triage_result: ${{ steps.triage.outputs.agent_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Antigravity CLI (agy)
        run: |
          npm install -g @google/antigravity-cli || curl -fsSL https://antigravity.google/install.sh | sh || true

      - name: Triage with Antigravity agent
        id: triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          # Execute agy in non-interactive print mode with auto-approved permissions
          agy --dangerously-skip-permissions -p \
            "Triage GitHub issue #${{ github.event.issue.number }} in this repository using the triage skill at .agents/skills/triage/SKILL.md.

            - Repository: ${{ github.repository }}
            - Issue URL: ${{ github.event.issue.html_url }}

            Follow the triage skill: use the `gh` CLI to fetch the full issue (title, body, comments, existing labels) and related open issues, read `roadmap.md` and `vision.md` if present, inspect this checked-out codebase, then choose exactly one implementation-readiness state.

            Return the JSON result the skill specifies as your final response; the apply job applies the label and comment from it. Do not comment on, label, or otherwise mutate the issue directly from this job." > raw_agent_output.txt

          # Set output for downstream apply job
          echo "agent_output<<EOF" >> $GITHUB_OUTPUT
          cat raw_agent_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  apply:
    name: Apply triage result
    needs: triage
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apply label and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.triage_result }}
        run: |
          set -euo pipefail

          if [ -z "${TRIAGE_RESULT:-}" ]; then
            echo "::error::Triage job produced no output; nothing to apply." >&2
            exit 1
          fi

          printf '%s' "$TRIAGE_RESULT" > raw_output.txt
          if ! python3 - raw_output.txt > triage_result.json <<'PY'
          import json, sys

          text = open(sys.argv[1], encoding="utf-8").read()
          decoder = json.JSONDecoder()
          last_obj = last_triage = None
          for i, ch in enumerate(text):
              if ch != "{":
                  continue
              try:
                  obj, _ = decoder.raw_decode(text[i:])
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict):
                  last_obj = obj
                  if "state" in obj and "label" in obj:
                      last_triage = obj
          result = last_triage if last_triage is not None else last_obj
          if result is None:
              sys.exit(1)
          json.dump(result, sys.stdout)
          PY
          then
            echo "::error::Could not find a JSON object in the agent output. Raw output:" >&2
            cat raw_output.txt >&2
            exit 1
          fi

          STATE="$(jq -r '.state // ""' triage_result.json)"
          LABEL="$(jq -r '.label // ""' triage_result.json)"

          if [ -z "$STATE" ]; then
            echo "::error::Triage result is missing a 'state'." >&2
            exit 1
          fi

          if [ -z "$LABEL" ]; then
            echo "::error::Triage result is missing a 'label' to apply." >&2
            exit 1
          fi

          echo "Triage state: $STATE"
          echo "Applying label: $LABEL"

          while IFS= read -r remove_label; do
            [ -z "$remove_label" ] && continue
            echo "Removing label: $remove_label"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$remove_label" || true
          done < <(jq -r '(.remove_labels // [])[]' triage_result.json)

          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$LABEL"

          jq -r '.comment // ""' triage_result.json > comment.md
          if [ -s comment.md ]; then
            printf '\n\n---\n_Powered by [Antigravity CLI](https://antigravity.google)_\n' >> comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file comment.md
          else
            echo "No comment body provided by triage result; skipping comment."
          fi


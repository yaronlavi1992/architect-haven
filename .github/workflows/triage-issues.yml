name: Triage New Issues

# Triages a newly opened issue with an Antigravity (agy) agent.
#
# The agent runs read-only (issues: read) and emits a structured JSON result;
# the separate `apply` job (issues: write) applies the label and comment to the
# triggering issue only.
#
# Setup: the GEMINI_API_KEY repository secret must be set.

on:
  issues:
    types: [opened]

# Avoid duplicate triage runs if the same issue fires overlapping events.
concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage issue
    runs-on: ubuntu-latest
    permissions:
      contents: read # let the agent inspect the checked-out codebase
      issues: read # let the agent read the issue/comments/labels — never write
    outputs:
      triage_result: ${{ steps.triage.outputs.agent_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Triage with AI Agent
        id: triage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request, urllib.error, subprocess

          issue_num = os.environ['ISSUE_NUMBER']
          gh_token = os.environ.get('GH_TOKEN', '').strip()
          groq_key = os.environ.get('GROQ_API_KEY', '').strip()
          gemini_key = os.environ.get('GEMINI_API_KEY', '').strip()

          # Fetch issue details via gh
          issue_raw = subprocess.check_output(['gh', 'issue', 'view', issue_num, '--json', 'title,body,comments,labels']).decode('utf-8')

          # Read skill file if present
          skill_content = ""
          if os.path.exists('.agents/skills/triage/SKILL.md'):
              with open('.agents/skills/triage/SKILL.md', 'r') as f:
                  skill_content = f.read()

          prompt = f"""
          You are an AI Triage Agent for this repository.

          Triage Skill Instructions:
          {skill_content}

          Target Issue Information:
          {issue_raw}

          Analyze the issue. Choose exactly one readiness state:
          - "Ready to implement" -> label: "Ready to implement"
          - "Ready to spec" -> label: "Ready to spec"
          - "Needs info" -> label: "Needs info"
          - "Wait to implement" -> label: "Wait to implement"

          Return ONLY a raw JSON object with keys:
          {{
            "state": "<chosen state>",
            "label": "<chosen label>",
            "comment": "<clear markdown explanation of why this triage state was chosen>",
            "remove_labels": ["Ready to implement", "Ready to spec", "Needs info", "Wait to implement"]
          }}
          """

          res_text = None

          # 1. Try GitHub Models API using the built-in GITHUB_TOKEN (Zero Setup Required!)
          if gh_token and not res_text:
              print("Attempting triage with GitHub Models API (gpt-4o-mini)...")
              url = "https://models.inference.ai.azure.com/chat/completions"
              headers = {
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {gh_token}",
                  "User-Agent": "GitHub-Action-Triage"
              }
              payload = {
                  "model": "gpt-4o-mini",
                  "response_format": {"type": "json_object"},
                  "messages": [
                      {"role": "system", "content": "You are a helpful GitHub issue triage agent. Output valid JSON only."},
                      {"role": "user", "content": prompt}
                  ],
                  "temperature": 0.1
              }
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method='POST')
                  with urllib.request.urlopen(req) as resp:
                      res_json = json.loads(resp.read().decode('utf-8'))
                      res_text = res_json['choices'][0]['message']['content']
                      print("Successfully received triage from GitHub Models API!")
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode('utf-8')
                  print(f"GitHub Models API failed ({e.code}): {err_body}")
              except Exception as e:
                  print(f"GitHub Models API failed: {e}")

          # 2. Try Groq API if available
          if groq_key and not res_text:
              print("Attempting triage with Groq API (llama-3.3-70b-versatile)...")
              url = "https://api.groq.com/openai/v1/chat/completions"
              headers = {
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {groq_key}",
                  "User-Agent": "GitHub-Action-Triage"
              }
              payload = {
                  "model": "llama-3.3-70b-versatile",
                  "response_format": {"type": "json_object"},
                  "messages": [
                      {"role": "system", "content": "You are a helpful GitHub issue triage agent. Output valid JSON only."},
                      {"role": "user", "content": prompt}
                  ],
                  "temperature": 0.1
              }
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers, method='POST')
                  with urllib.request.urlopen(req) as resp:
                      res_json = json.loads(resp.read().decode('utf-8'))
                      res_text = res_json['choices'][0]['message']['content']
                      print("Successfully received triage from Groq API!")
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode('utf-8')
                  print(f"Groq API failed ({e.code}): {err_body}")
              except Exception as e:
                  print(f"Groq API call failed: {e}")

          # 3. Fallback to Gemini API if previous methods failed
          if gemini_key and not res_text:
              print("Attempting triage with Gemini API...")
              models = ["gemini-2.0-flash-lite", "gemini-2.0-flash", "gemini-1.5-flash"]
              headers = {"Content-Type": "application/json", "X-goog-api-key": gemini_key}
              data = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode('utf-8')
              for model in models:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers, method='POST')
                      with urllib.request.urlopen(req) as resp:
                          res_body = json.loads(resp.read().decode('utf-8'))
                          res_text = res_body['candidates'][0]['content']['parts'][0]['text']
                          print(f"Successfully generated response with Gemini model {model}")
                          break
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode('utf-8')
                      print(f"Gemini model {model} failed ({e.code}): {err_body}")
                  except Exception as e:
                      print(f"Gemini model {model} failed: {e}")

          if not res_text:
              raise RuntimeError("All AI providers failed to generate a response.")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f_out:
              f_out.write("agent_output<<EOF\n")
              f_out.write(res_text)
              f_out.write("\nEOF\n")
          EOF

  apply:
    name: Apply triage result
    needs: triage
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    steps:
      - name: Apply label and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.triage_result }}
        run: |
          set -euo pipefail

          if [ -z "${TRIAGE_RESULT:-}" ]; then
            echo "::error::Triage job produced no output; nothing to apply." >&2
            exit 1
          fi

          printf '%s' "$TRIAGE_RESULT" > raw_output.txt
          if ! python3 - raw_output.txt > triage_result.json <<'PY'
          import json, sys

          text = open(sys.argv[1], encoding="utf-8").read()
          decoder = json.JSONDecoder()
          last_obj = last_triage = None
          for i, ch in enumerate(text):
              if ch != "{":
                  continue
              try:
                  obj, _ = decoder.raw_decode(text[i:])
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict):
                  last_obj = obj
                  if "state" in obj and "label" in obj:
                      last_triage = obj
          result = last_triage if last_triage is not None else last_obj
          if result is None:
              sys.exit(1)
          json.dump(result, sys.stdout)
          PY
          then
            echo "::error::Could not find a JSON object in the agent output. Raw output:" >&2
            cat raw_output.txt >&2
            exit 1
          fi

          STATE="$(jq -r '.state // ""' triage_result.json)"
          LABEL="$(jq -r '.label // ""' triage_result.json)"

          if [ -z "$STATE" ]; then
            echo "::error::Triage result is missing a 'state'." >&2
            exit 1
          fi

          if [ -z "$LABEL" ]; then
            echo "::error::Triage result is missing a 'label' to apply." >&2
            exit 1
          fi

          echo "Triage state: $STATE"
          echo "Applying label: $LABEL"

          while IFS= read -r remove_label; do
            [ -z "$remove_label" ] && continue
            echo "Removing label: $remove_label"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$remove_label" || true
          done < <(jq -r '(.remove_labels // [])[]' triage_result.json)

          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$LABEL"

          jq -r '.comment // ""' triage_result.json > comment.md
          if [ -s comment.md ]; then
            printf '\n\n---\n_Powered by [Antigravity CLI](https://antigravity.google)_\n' >> comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file comment.md
          else
            echo "No comment body provided by triage result; skipping comment."
          fi

          # Labels written with GITHUB_TOKEN do not emit another workflow run.
          # Explicitly dispatch the next factory stage instead.
          case "$LABEL" in
            "Ready to implement"|"ready-to-implement"|"ready to implement")
              gh workflow run implement-ready-issues.yml \
                --repo "$REPO" \
                --ref "${{ github.event.repository.default_branch }}" \
                -f issue_number="$ISSUE_NUMBER"
              ;;
            "Ready to spec"|"ready-to-spec"|"ready to spec")
              gh workflow run spec-ready-issues.yml \
                --repo "$REPO" \
                --ref "${{ github.event.repository.default_branch }}" \
                -f issue_number="$ISSUE_NUMBER"
              ;;
          esac
